# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paf_test
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate || true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      # P-19/T-010. This carried `continue-on-error: true`, so `npx eslint src`
      # reported 142 errors and 68 warnings on every run and failed nothing.
      # The 142 errors are now 0 -- 115 of them `@typescript-eslint/no-explicit-any`,
      # the rule that would have caught every one of the phantom-Prisma-delegate
      # bugs this run found -- so the step gates for real. Nine narrowly-scoped
      # `eslint-disable-next-line` exceptions remain, each with a written reason
      # and each listed in the P-19 PR; there is no file-level or rule-level
      # suppression anywhere in src/.
      - name: Lint
        run: npx eslint src

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --passWithNoTests --coverage --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7


  db-tests:
    name: Real-Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deliberately NOT gated on lint-typecheck-test. Originally because that job
    # was red on the standing type errors, and gating this behind it would have
    # meant the real-database lane never executed for the entire parallel run --
    # so every cross-tenant test P-04..P-14 add would have been collected by
    # nobody. That reason expired with P-02 (tsc 0) and P-19 (lint 0), but the
    # second one has not: this job provisions its own Postgres and runs its own
    # migrations, so it needs nothing from the unit job, and keeping the two
    # lanes independent means a lint regression cannot hide a tenancy
    # regression.

    # P-00: this job exists because the audit found 186 of 320 test files calling
    # jest.mock('@/lib/db'), and zero tests touching a real database. A suite that
    # stubs Prisma cannot see a missing tenant check, an unstarted worker, or an
    # in-memory audit log -- which is every BLOCKER in the audit. The Postgres
    # service container below was already declared for the unit job and used by
    # no test at all.
    #
    # P-01 lands the harness. P-04..P-14 each add a cross-tenant refusal test.

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paf_dbtest
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paf_dbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # P-11: CI had no Redis anywhere, and tests/db/queue-worker.test.ts proves
      # a BullMQ worker consumes a job off a real queue and writes the result to
      # Postgres. That needs a real queue, so this job provisions one.
      #
      # DELIBERATELY NOT ADDED TO `lint-typecheck-test`. The unit job's
      # offline-queue tests exist to prove the documented degradation path --
      # "falls back to in-memory storage when Redis is unavailable" -- actually
      # degrades. Handing that job a Redis would make those tests pass by
      # removing the condition they are written to exercise, turning the board
      # green over a broken fallback in production code. Same repository, same
      # missing service, opposite correct answer: here the service is the honest
      # fix, there it would be the mask.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run real-database tests
        run: npm run test:db

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck-test

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paf_build
      NEXTAUTH_SECRET: ci-build-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paf_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: npx --yes audit-ci --high
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: personal-assistant-forge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
