# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paf_test
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate || true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      # P-19/T-010. This carried `continue-on-error: true`, so `npx eslint src`
      # reported 142 errors and 68 warnings on every run and failed nothing.
      # The 142 errors are now 0, so the step gates for real.
      #
      # 115 of those 142 were `@typescript-eslint/no-explicit-any` -- the rule
      # that would have caught every phantom-Prisma-delegate bug in this
      # codebase, six found by the audit and four more by P-19. It is now
      # enforced with ZERO exceptions: `grep -rn "no-explicit-any" src` returns
      # one line and it is prose in a comment. Two file-level `eslint-disable`
      # blocks and 39 inline ones were removed, not worked around.
      #
      # Nine `eslint-disable-next-line react-hooks/*` exceptions remain, each
      # with a written reason at the site and each listed in the P-19 PR. If you
      # are about to add a tenth, put the reason next to it.
      #
      # -----------------------------------------------------------------------
      # P-35/T-011 -- the argument was removed. This step ran `npx eslint src`.
      #
      # `npm run lint` -- the whole repository -- reported 332 problems and 128
      # errors, all of them under `tests/`, and gated nothing. That is not a
      # cosmetic gap, because of what the 128 were: 87 `no-explicit-any`, and a
      # large share of those sat on a mocked Prisma client. P-28 states the
      # consequence exactly:
      #
      #     A mocked delegate returns whatever the test told it to, so a mocked
      #     `prisma.attentionEvent.findMany` PROVES THE OPPOSITE of what is true
      #     in production: it proves the delegate exists.
      #
      # A mock is a claim about an interface and `any` is what stops anyone
      # checking the claim, so `no-explicit-any` on a db mock is the SAME defect
      # class as the 173 `as any` P-19 removed from `src`. Enforcing the rule on
      # the code and not on the 203 files that mock the code left the half where
      # the ten phantom-delegate bugs actually hid.
      #
      # WHY BARE `npx eslint` AND NOT `npx eslint src tests`
      #
      # Measured, not assumed. Bare `npx eslint` lints 1,686 files; `npx eslint
      # src` lints 1,350. The 336-file difference is `tests/` (329), `scripts/`
      # (1), `prisma/` (1) and the five root configs -- including
      # `eslint.config.mjs`, `jest.config.ts` and `next.config.ts`, none of which
      # any gate has ever looked at. All 336 are at zero errors today.
      #
      # A path list is the thing that goes stale: it is right until someone adds
      # a top-level directory, and then it is silently wrong with a green tick,
      # which is how this step spent its first life. `npx eslint` with no
      # arguments takes its scope from `eslint.config.mjs`, so a new directory
      # is covered on the day it is created by nobody remembering anything. It
      # also matches `npm run lint`, so what a developer runs locally and what
      # CI runs are now the same command.
      #
      # WARNINGS ARE STILL WARNINGS. There are 203 (191 `no-unused-vars`, which
      # this repo's own config sets to "warn"). `--max-warnings 0` would fail
      # today, and a gate that arrives failing teaches people to disable gates.
      # Errors are the line; moving warnings to it is a separate package's job.
      - name: Lint
        run: npx eslint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --passWithNoTests --coverage --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7


  db-tests:
    name: Real-Database Tests
    runs-on: ubuntu-latest
    # 30, not 15. This suite normally finishes in 5-7 minutes (5m40s, 6m36s,
    # 6m54s, 7m00s over the last four runs), so 15 looked like ample headroom.
    # It is not: on 2026-09-10 an identical tree ran 5-8x slower on a degraded
    # runner -- content-tenancy 28s -> 201s, analytics 31s -> 214s, inbox 24s ->
    # 189s -- and was cancelled at the ceiling with every suite it had reached
    # passing. A ceiling only ~2x the normal runtime turns runner variance into
    # a red master, and "cancelled" reads like a hang, which invites a re-run
    # instead of a diagnosis.
    #
    # This does NOT weaken the protection the ceiling exists for. The failure it
    # guards against -- P-18's Redis singleton and P-20's un-`unref`ed
    # `setInterval`, where every test passes and the PROCESS never exits -- is
    # unbounded. It hits 30 exactly as reliably as it hit 15; it just costs
    # fifteen more minutes on the rare occasion it happens. Slow is bounded,
    # hung is not, and only the ceiling's height distinguishes them.
    timeout-minutes: 30

    # Deliberately NOT gated on lint-typecheck-test. Originally because that job
    # was red on the standing type errors, and gating this behind it would have
    # meant the real-database lane never executed for the entire parallel run --
    # so every cross-tenant test P-04..P-14 add would have been collected by
    # nobody. That reason expired with P-02 (tsc 0) and P-19 (lint 0), but the
    # second one has not: this job provisions its own Postgres and runs its own
    # migrations, so it needs nothing from the unit job, and keeping the two
    # lanes independent means a lint regression cannot hide a tenancy
    # regression.

    # P-00: this job exists because the audit found 186 of 320 test files calling
    # jest.mock('@/lib/db'), and zero tests touching a real database. A suite that
    # stubs Prisma cannot see a missing tenant check, an unstarted worker, or an
    # in-memory audit log -- which is every BLOCKER in the audit. The Postgres
    # service container below was already declared for the unit job and used by
    # no test at all.
    #
    # P-01 lands the harness. P-04..P-14 each add a cross-tenant refusal test.

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paf_dbtest
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paf_dbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # P-11: CI had no Redis anywhere, and tests/db/queue-worker.test.ts proves
      # a BullMQ worker consumes a job off a real queue and writes the result to
      # Postgres. That needs a real queue, so this job provisions one.
      #
      # DELIBERATELY NOT ADDED TO `lint-typecheck-test`. The unit job's
      # offline-queue tests exist to prove the documented degradation path --
      # "falls back to in-memory storage when Redis is unavailable" -- actually
      # degrades. Handing that job a Redis would make those tests pass by
      # removing the condition they are written to exercise, turning the board
      # green over a broken fallback in production code. Same repository, same
      # missing service, opposite correct answer: here the service is the honest
      # fix, there it would be the mask.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run real-database tests
        run: npm run test:db

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck-test

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paf_build
      NEXTAUTH_SECRET: ci-build-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paf_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: npx --yes audit-ci --high
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: personal-assistant-forge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
