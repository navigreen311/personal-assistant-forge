# docker-compose.yml
#
# T-032: the top-level `version:` key was removed from the Compose
# specification. Compose v2 ignores it and warns on every command.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: paf-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://paf_user:paf_password@postgres:5432/paf_dev
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      - NEXTAUTH_URL=http://localhost:3000
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - paf-network

  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: paf-init
    command: npx -y prisma@6.19.2 migrate deploy
    environment:
      - DATABASE_URL=postgresql://paf_user:paf_password@postgres:5432/paf_dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paf-network
    restart: "no"

  # P-11 / T-006 -- the consumer.
  #
  # Without this service the `app` container enqueues workflow executions, cron
  # ticks, capture items and every JobType into the `redis` service below, and
  # nothing ever reads them back out. The queue was declared, wired and
  # configured with three attempts and exponential backoff; it had no consumer,
  # so no job was ever attempted once.
  #
  # Same image build, different stage and different command. It publishes no
  # port: it is reached only through Redis.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: paf-worker
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://paf_user:paf_password@postgres:5432/paf_dev
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # SIGTERM is what scripts/worker.ts listens for, and the grace period is set
    # longer than the entrypoint's own 30s force-exit deadline so the process
    # always gets to finish its drain and exit on its own terms. If Docker
    # SIGKILLed first, in-flight jobs would stay in BullMQ's `active` set holding
    # a lock until a later worker's stalled check expired it.
    stop_signal: SIGTERM
    stop_grace_period: 40s
    networks:
      - paf-network

  postgres:
    image: postgres:16-alpine
    container_name: paf-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paf_user
      POSTGRES_PASSWORD: paf_password
      POSTGRES_DB: paf_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paf_user -d paf_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - paf-network

  redis:
    image: redis:7-alpine
    container_name: paf-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - paf-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  paf-network:
    driver: bridge
